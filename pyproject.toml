[project]
name = "audio-dashboard"
version = "0.1.0"
description = "Audio analysis dashboard for ASR routing and error diagnosis"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "assemblyai>=0.62.0",
    "elevenlabs>=2.59.0",
    "numpy>=2.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "silero-vad>=5.1",
    "torch>=2.5",
    "matplotlib>=3.9",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_dashboard"]
